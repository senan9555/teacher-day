<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e7ddd0">

<title>Teacher Day — Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#e7ddd0;
  color:#29251f;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
}

.card{
  width:min(90vw,360px);
  padding:38px 24px;
  border-radius:28px;
  background:rgba(255,255,255,.72);
  box-shadow:0 20px 55px rgba(70,50,30,.15);
  text-align:center;
}

.label{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:#806c53;
  font-weight:700;
}

.count{
  font-size:64px;
  line-height:1;
  margin:16px 0 8px;
  font-weight:700;
  letter-spacing:-.05em;
}

.sub{
  font-size:13px;
  color:#75695b;
}

button{
  margin-top:22px;
  border:0;
  border-radius:14px;
  padding:11px 18px;
  background:#29251f;
  color:white;
  font-size:14px;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="card">

  <div class="label">
    Teacher's Day
  </div>

  <div class="count" id="count">
    —
  </div>

  <div class="sub">
    total page visits
  </div>

  <button onclick="loadCount()">
    Refresh
  </button>

</div>

<script>

async function loadCount(){

  const el = document.getElementById("count");

  try{

    const response = await fetch(
      "https://countapi.mileshilliard.com/api/v1/get/teacher_day_2026_sunshine_7f3c91b2e6",
      {
        cache:"no-store"
      }
    );

    const data = await response.json();

    el.textContent = data.value ?? "—";

  }catch(error){

    el.textContent = "—";

  }

}

loadCount();

</script>

</body>
</html>
